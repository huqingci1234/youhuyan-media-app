name: Build Youhuyan Phone and TV APKs (split upstreams)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Keep phone and TV release builds serialized; never cancel a build already in progress.
concurrency:
  group: youhuyan-apk-release
  cancel-in-progress: false

jobs:
  phone:
    name: Phone APK - Lanxing mobile base
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout brand workflow
        uses: actions/checkout@v4
        with:
          path: brand
      - name: Checkout recent mobile source
        uses: actions/checkout@v4
        with:
          repository: cyj265/lanxing-vod
          ref: dev-5.6.1
          path: phone
          fetch-depth: 0
      - name: Apply Youhuyan phone branding
        working-directory: phone
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # This upstream branch intentionally ships with no built-in depot or source list.
          depot = Path("app/src/main/java/com/fongmi/android/tv/bean/BuiltinDepot.java").read_text(encoding="utf-8")
          if 'public static final String URL = null;' not in depot or 'public static final String EXTRA_YL_URL = "";' not in depot:
              raise SystemExit("Unexpected built-in mobile source configuration; refusing to bundle it.")
          if Path("app/src/main/assets/clys/chenlong.jpg").exists():
              raise SystemExit("Unexpected built-in mobile source depot asset; refusing to bundle it.")

          # Replace visible legacy branding in all Android XML resources.
          for p in Path("app/src").rglob("*.xml"):
              s = p.read_text(encoding="utf-8")
              updated = s.replace("揽星影视", "尤湖沿影视").replace("揽星视频", "尤湖沿影视")
              if updated != s:
                  p.write_text(updated, encoding="utf-8")

          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")
          old = 'applicationId "com.cyj265.lanxingvod"'
          new = 'applicationId "com.youhuyan.media"'
          if old not in s and new not in s:
              raise SystemExit("Expected mobile applicationId not found.")
          s = s.replace(old, new, 1)
          s = s.replace('output.outputFileName.set("揽星影视-${mode}-${abi}-${buildNumber}.apk")',
                        'output.outputFileName.set("Youhuyan-${mode}-${abi}-${buildNumber}.apk")')
          p.write_text(s, encoding="utf-8")

          # Verify locale-specific labels and visible resources no longer use the old brand.
          for name in ["app/src/main/res/values/strings.xml",
                       "app/src/main/res/values-zh-rCN/strings.xml",
                       "app/src/main/res/values-zh-rTW/strings.xml"]:
              data = Path(name).read_text(encoding="utf-8")
              if '<string name="app_name">尤湖沿影视</string>' not in data:
                  raise SystemExit(f"Brand label verification failed: {name}")
          PY
          cat > YOUHUYAN-SOURCE-NOTICE.md <<'EOF'
          尤湖沿影视手机版
          Based on https://github.com/cyj265/lanxing-vod (GPL-3.0).
          Original copyright notices and license files are retained.
          Branding changes: applicationId com.youhuyan.media; all localized app labels and visible brand strings use 尤湖沿影视.
          No video source, live channel list, or third-party JSON endpoint is bundled.
          Users must import configurations they are authorized to use.
          EOF
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 37 build packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build phone release APK
        working-directory: phone
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleMobileArm64_v8aRelease 2>&1 | tee build-phone.log
      - name: Publish modified GPL phone source
        if: success()
        working-directory: phone
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached .github/workflows || true
          git add -u
          git add -f YOUHUYAN-SOURCE-NOTICE.md
          git commit -m "Brand Lanxing mobile source as Youhuyan Media"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/youhuyan-mobile-source
      - name: Upload phone build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youhuyan-phone-build-log
          path: phone/build-phone.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Youhuyan phone APK
        uses: actions/upload-artifact@v4
        with:
          name: youhuyan-phone-apk
          path: phone/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  tv:
    name: TV APK - TVBoxOS base
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout brand workflow
        uses: actions/checkout@v4
        with:
          path: brand
      - name: Checkout TVBoxOS source
        uses: actions/checkout@v4
        with:
          repository: q215613905/TVBoxOS
          ref: main
          path: television
          fetch-depth: 0
      - name: Apply Youhuyan TV branding
        working-directory: television
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")
          old = "applicationId 'com.github.tvbox.osc.jun'"
          new = "applicationId 'com.youhuyan.media.tv'"
          if old not in s:
              raise SystemExit("Expected TVBoxOS applicationId not found.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          # Set the app label in every values locale, not just the default locale.
          for p in Path("app/src/main/res").glob("values*/strings.xml"):
              s = p.read_text(encoding="utf-8")
              import re
              s, count = re.subn(r'(<string\s+name="app_name">).*?(</string>)',
                                 r'\1尤湖沿影视\2', s, count=1, flags=re.S)
              if count:
                  p.write_text(s, encoding="utf-8")

          # Keep EPG support available but ship no preloaded channel-name list or third-party logo URLs.
          epg = Path("app/src/main/assets/epg_data.json")
          if epg.exists():
              epg.write_text('{"epgs":[]}\n', encoding="utf-8")
          import json
          if epg.exists() and json.loads(epg.read_text(encoding="utf-8")).get("epgs") != []:
              raise SystemExit("Bundled EPG channel metadata was not cleared.")

          # Remove TVBox from the generated APK filename as well.
          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")
          s = s.replace('def fileName = "TVBox_', 'def fileName = "Youhuyan-TV_')
          p.write_text(s, encoding="utf-8")

          label = Path("app/src/main/res/values/strings.xml").read_text(encoding="utf-8")
          if '<string name="app_name">尤湖沿影视</string>' not in label:
              raise SystemExit("TV app label verification failed.")
          gradle = Path("app/build.gradle").read_text(encoding="utf-8")
          if 'def fileName = "TVBox_' in gradle:
              raise SystemExit("Legacy TVBox APK filename remains.")
          PY
          cat > YOUHUYAN-SOURCE-NOTICE.md <<'EOF'
          尤湖沿影视 TV 版
          Based on https://github.com/q215613905/TVBoxOS (AGPL-3.0).
          Original copyright notices and license files are retained.
          Branding changes: applicationId com.youhuyan.media.tv; app label 尤湖沿影视.
          No video source, live channel list, or third-party JSON endpoint is bundled.
          Users must import configurations they are authorized to use.
          EOF
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 33 build packages
        run: |
          sdkmanager "platforms;android-33" "build-tools;33.0.2"
          echo "sdk.dir=$ANDROID_HOME" > television/local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build TV release APKs
        working-directory: television
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleJavaRelease :app:assembleJava32Release :app:assembleJava64Release 2>&1 | tee build-tv.log
      - name: Publish modified AGPL TV source
        if: success()
        working-directory: television
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached .github/workflows || true
          git add -u
          git add -f YOUHUYAN-SOURCE-NOTICE.md
          git commit -m "Brand TVBoxOS source as Youhuyan Media TV"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/youhuyan-tv-source
      - name: Upload TV build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youhuyan-tv-build-log
          path: television/build-tv.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Youhuyan TV APKs
        uses: actions/upload-artifact@v4
        with:
          name: youhuyan-tv-apks
          path: television/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

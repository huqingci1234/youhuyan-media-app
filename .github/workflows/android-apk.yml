name: Build Youhuyan Mobile and TV (FongMi-derived)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Youhuyan workflow
        uses: actions/checkout@v4
        with:
          path: brand

      - name: Checkout complete FongMi-derived source
        uses: actions/checkout@v4
        with:
          repository: webhtv/webhtv
          ref: main
          path: source
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK and native tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Apply Youhuyan branding only
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")
          old = 'applicationId "com.fongmi.android.tv"'
          new = 'applicationId "com.youhuyan.media"'
          if old not in s:
              raise SystemExit("FongMi applicationId not found; stop rather than patch unexpected source.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = Path("app/src/main/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          old = '<string name="app_name">TV</string>'
          new = '<string name="app_name">尤湖沿影视</string>'
          if old not in s:
              raise SystemExit("App label not found; stop rather than patch unexpected source.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          cat > YOUHUYAN-NOTICE.md <<'EOF'
          Youhuyan Media Android build
          =============================

          Based on WebHTV, an open-source Android project derived from FongMi/TV
          and the CatVod ecosystem:
          https://github.com/webhtv/webhtv
          https://github.com/FongMi/TV

          License: GNU General Public License v3.0 (GPL-3.0). Original license,
          copyright notices, and third-party notices are retained.

          Branding changes:
          - Android application ID: com.youhuyan.media
          - Display name: 尤湖沿影视

          No third-party video sources, live-TV lists, or JSON configuration
          endpoints are bundled. Users must import configurations they are
          authorized to use.
          EOF

      - name: Verify bundled playback dependencies
        working-directory: source
        run: bash scripts/verify_mpv_native_assets.sh --require-elf

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build phone and TV APKs (32-bit and 64-bit)
        working-directory: source
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:assembleMobileArm64_v8aDebug \
            :app:assembleMobileArmeabi_v7aDebug \
            :app:assembleLeanbackArm64_v8aDebug \
            :app:assembleLeanbackArmeabi_v7aDebug 2>&1 | tee build.log

      - name: Publish corresponding GPL source
        if: success()
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan youhuyan-fongmi-source
          rm -rf .github/workflows
          git add -A
          git commit -m "Publish GPL-3.0 FongMi-derived source branded as Youhuyan Media"
          git remote remove origin
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/youhuyan-fongmi-source

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youhuyan-build-log
          path: source/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Youhuyan APKs
        uses: actions/upload-artifact@v4
        with:
          name: youhuyan-fongmi-mobile-tv-apks
          path: source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

name: Build Youhuyan from FongMi TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Youhuyan project
        uses: actions/checkout@v4
        with:
          path: brand

      - name: Checkout FongMi TV open-source base
        uses: actions/checkout@v4
        with:
          repository: FongMi/TV
          ref: fongmi
          path: source
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply Youhuyan branding
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          old = 'applicationId "com.fongmi.android.tv"'
          new = 'applicationId "com.youhuyan.media"'
          if old not in s:
              raise SystemExit("Could not locate the upstream applicationId; stop rather than patch the wrong source.")
          p.write_text(s.replace(old, new, 1))
          p = Path("app/src/main/res/values/strings.xml")
          s = p.read_text()
          old = '<string name="app_name">TV</string>'
          new = '<string name="app_name">尤湖沿影视</string>'
          if old not in s:
              raise SystemExit("Could not locate the upstream app label; stop rather than patch the wrong source.")
          p.write_text(s.replace(old, new, 1))
          PY
          cat > YOUHUYAN-NOTICE.md <<'EOF'
          尤湖沿影视 Android build
          =========================

          Open-source base: https://github.com/FongMi/TV
          Upstream branch: fongmi
          Upstream license: GNU General Public License v3.0 (GPL-3.0)

          Branding modifications in this build:
          - Android application ID changed to com.youhuyan.media.
          - Display name changed to 尤湖沿影视.

          The upstream source files and their original copyright and license
          notices are retained. This project is distributed under GPL-3.0.
          Corresponding source for this branded build is published in the
          youhuyan-media-app repository branch named fongmi-base.
          EOF

      - name: Publish corresponding GPL source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        working-directory: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan youhuyan-source
          rm -rf .github/workflows
          git add -A
          git commit -m "Publish GPL-3.0 FongMi TV source branded as Youhuyan Media"
          git remote remove origin
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/fongmi-base

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local signing config
        working-directory: source
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass youhuyan-preview -alias youhuyan -keypass youhuyan-preview -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Youhuyan Media, OU=Android, O=Youhuyan, L=Unknown, ST=Unknown, C=CN"
          cat > local.properties <<'EOF'
          storeFile=../debug.keystore
          keyAlias=youhuyan
          storePassword=youhuyan-preview
          EOF

      - name: Build Android phone and TV APKs
        working-directory: source
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleMobileDebug assembleLeanbackDebug 2>&1 | tee build.log

      - name: Publish build diagnostics on failure
        if: failure()
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f build.log ]; then
            tail -n 220 build.log > /tmp/BUILD-FAILURE.log
          else
            printf "Build log was not created.\n" > /tmp/BUILD-FAILURE.log
          fi
          gh issue create --title "Android build diagnostics - run ${GITHUB_RUN_ID}" --body-file /tmp/BUILD-FAILURE.log

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youhuyan-gradle-build-log
          path: source/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Youhuyan APKs
        uses: actions/upload-artifact@v4
        with:
          name: youhuyan-fongmi-android-apks
          path: source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

name: Python Resource Service CI
on:
  push:
    branches: [python-resource-service]
    paths:
      - "python-service/**"
      - ".github/workflows/python-service.yml"
  pull_request:
    paths:
      - "python-service/**"
      - ".github/workflows/python-service.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

name: AVBox dual-target build

on:
  workflow_dispatch:
  push:
    branches: [avbox-final]
    paths:
      - ".github/workflows/avbox-build.yml"
      - "scripts/avbox/**"
      - "docs/AVBOX_DUAL_TARGET_PLAN.md"

permissions:
  contents: read

concurrency:
  group: avbox-final-build
  cancel-in-progress: false

jobs:
  android:
    name: Build mobile and TV APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout AVBox source
        uses: actions/checkout@v4
        with:
          repository: XiaochangXu/AVBox
          ref: main
          path: app-source

      - name: Checkout maintained overlay
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          path: overlay

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: app-source/**/*.gradle*

      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Apply mobile and TV build targets
        working-directory: app-source
        run: python3 ../overlay/scripts/avbox/prepare-dual-target.py

      - name: Prepare release signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            mkdir -p .key
            printf '%s' "$KEYSTORE_B64" | base64 --decode > .key/app-release.jks
            test -s .key/app-release.jks
            echo "release_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured. Building validation APKs only."
          fi

      - name: Build both signed release APKs
        if: steps.signing.outputs.release_signing == 'true'
        working-directory: app-source
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleMobileRelease :app:assembleTvRelease \
            -PRELEASE_STORE_FILE=.key/app-release.jks \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Build both debug APKs and unit tests
        if: steps.signing.outputs.release_signing != 'true'
        working-directory: app-source
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleMobileDebug :app:assembleTvDebug \
            :app:testMobileDebugUnitTest :app:testTvDebugUnitTest

      - name: Verify mobile and TV package IDs
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          mobile_apk="$(find app/build/outputs/apk/mobile -name '*.apk' -type f | head -n 1)"
          tv_apk="$(find app/build/outputs/apk/tv -name '*.apk' -type f | head -n 1)"
          test -n "$mobile_apk"
          test -n "$tv_apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump badging "$mobile_apk" | grep -F "package: name='com.youhuyan.media'"
          "$aapt" dump badging "$tv_apk" | grep -F "package: name='com.youhuyan.media.tv'"
          echo "Mobile APK: $mobile_apk"
          echo "TV APK: $tv_apk"

      - name: Upload mobile and TV APKs
        uses: actions/upload-artifact@v4
        with:
          name: youhuyan-avbox-${{ steps.signing.outputs.release_signing == 'true' && 'release-signed' || 'debug-validation' }}
          path: app-source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        working-directory: app-source
        run: rm -f .key/app-release.jks
